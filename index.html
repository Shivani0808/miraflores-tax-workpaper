<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Miraflores | Evidence Workpaper</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, Arial;
        color: #182533;
        background: #f4f6f9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      .shell {
        display: grid;
        grid-template-columns: 235px 1fr;
        min-height: 100vh;
      }

      .side {
        background: #11263b;
        color: #deecf9;
        padding: 25px 15px;
      }

      .brand {
        font-size: 20px;
        font-weight: 750;
        padding: 5px 10px 20px;
      }

      .brand span {
        color: #83d4bf;
      }

      .sub {
        font-size: 10px;
        color: #9eb6c8;
        letter-spacing: 2px;
      }

      .nav {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        color: #bcd0e3;
        padding: 13px;
        border-radius: 9px;
        font-size: 14px;
        cursor: pointer;
      }

      .nav.active,
      .nav:hover {
        background: #24445b;
        color: white;
      }

      .main {
        padding: 24px 32px;
        min-width: 0;
        max-width: 1660px;
        width: 100%;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 26px;
      }

      .eyebrow {
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 1.6px;
        color: #718094;
      }

      h1 {
        margin: 5px 0;
        font-size: 28px;
      }

      h2 {
        font-size: 17px;
        margin: 0 0 15px;
      }

      h3 {
        font-size: 14px;
        margin: 0 0 10px;
      }

      .muted {
        color: #64758a;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .right {
        margin-left: auto;
      }

      select,
      input,
      textarea {
        font: inherit;
        border: 1px solid #d1dbe4;
        border-radius: 8px;
        padding: 9px 11px;
        background: white;
        color: #182533;
      }

      textarea {
        width: 100%;
        min-height: 70px;
      }

      button {
        cursor: pointer;
      }

      .btn {
        border: 0;
        background: #1b6f83;
        color: #fff;
        border-radius: 8px;
        padding: 10px 14px;
      }

      .btn.secondary {
        background: #e6edf3;
        color: #223e54;
      }

      .btn.danger {
        background: #fbe8e6;
        color: #9b332a;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
      }

      .panel,
      .stat {
        background: white;
        border: 1px solid #dfe5ed;
        border-radius: 12px;
        padding: 19px;
        margin-bottom: 17px;
      }

      .stat strong {
        font-size: 25px;
        display: block;
        margin: 8px 0;
      }

      .stat span {
        font-size: 12px;
        color: #617387;
      }

      .cols {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 17px;
      }

      .triple {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 15px;
      }

      .tablewrap {
        overflow: auto;
        max-height: 65vh;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th {
        color: #68798b;
        text-align: left;
        background: #f7f9fb;
        position: sticky;
        top: 0;
      }

      td,
      th {
        padding: 11px 9px;
        border-bottom: 1px solid #edf0f3;
        vertical-align: top;
      }

      tr.clickable:hover {
        background: #eff8fa;
        cursor: pointer;
      }

      .tag {
        padding: 3px 8px;
        font-size: 11px;
        border-radius: 20px;
        background: #eaf2f7;
        color: #2d6072;
      }

      .critical {
        background: #fbe5e3;
        color: #9e2b29;
      }

      .high {
        background: #fff0d8;
        color: #8e5610;
      }

      .medium {
        background: #e8edf8;
        color: #476189;
      }

      .good {
        background: #e1f4ea;
        color: #20744f;
      }

      .small {
        font-size: 12px;
      }

      .document {
        background: #fcfcfa;
        border: 1px solid #d3d8d8;
        padding: 18px;
        border-radius: 8px;
        white-space: pre-wrap;
        line-height: 1.8;
        font-family: Georgia, serif;
        font-size: 14px;
        max-height: 410px;
        overflow: auto;
      }

      .selected {
        outline: 2px solid #2f8fa7;
        background: #edfbff;
        padding: 4px;
        border-radius: 5px;
      }

      .doclink {
        color: #136c84;
        cursor: pointer;
        text-decoration: underline;
      }

      .details {
        padding: 12px;
        background: #f3f7fa;
        border-radius: 8px;
        overflow-wrap: anywhere;
      }

      .hidden {
        display: none;
      }

      code {
        font-size: 12px;
      }

      #notice {
        position: fixed;
        bottom: 17px;
        right: 18px;
        background: #172f42;
        color: white;
        padding: 12px 17px;
        border-radius: 9px;
        display: none;
        z-index: 5;
      }

      .mini {
        font-size: 11px;
      }

      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      @media (max-width: 900px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .side {
          display: flex;
          flex-wrap: wrap;
          padding: 10px;
        }

        .brand {
          width: 100%;
        }

        .nav {
          width: auto;
        }

        .main {
          padding: 14px;
        }

        .stats,
        .cols,
        .triple,
        .split {
          grid-template-columns: 1fr;
        }

        .top {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>

  <body>
    <div class="shell">
      <aside class="side">
        <div class="brand">
          Miraflores <span>◇</span>
          <div class="sub">EVIDENCE WORKPAPER</div>
        </div>
        <div id="nav"></div>
        <p class="mini" style="padding: 15px; color: #9ab7c7">
          2025 • Okafor–Lindqvist<br />Local prototype • review state persists
          in this browser
        </p>
      </aside>
      <main class="main">
        <header class="top">
          <div>
            <div class="eyebrow">
              Client CL-20417 · TY2025 · Joint federal + California
            </div>
            <h1 id="heading">Review overview</h1>
            <span class="muted">Source-linked controls, not a spreadsheet</span>
          </div>
          <div class="row">
            <label class="small"
              >Role
              <select id="role"></select></label
            ><button class="btn secondary" id="export">
              Export review JSON
            </button>
          </div>
        </header>
        <div id="app"></div>
      </main>
    </div>
    <div id="notice"></div>
    <script src="packet.js"></script>
    <script src="issues.js"></script>
    <script>
      const P = window.PACKET,
        seed = window.SEED_ISSUES,
        V = P.return_versions,
        docs = P.documents,
        ev = P.extracted_values;
      let view = "overview",
        currentVersion = "v3",
        selectedLine = "F1040.1a",
        selectedDoc = "D31",
        selectedPage = 1,
        filter = "",
        selectedIssue = seed[0].id;
      const names = {
        overview: "Review overview",
        trace: "Lineage explorer",
        documents: "Evidence library",
        issues: "Exceptions & decisions",
        versions: "Return versions",
        whatif: "Scenario lab",
        workflow: "People & filing",
        audit: "Audit trail",
        checks: "Independent checks",
        corrections: "Corrections & undo",
        taxworkpapers: "Tax-area workpapers",
        filing: "Filing lifecycle",
        completeness: "Completion dashboard",
      };
      const key = "miraflores-workpaper-v1";
      let state;
      try {
        state = JSON.parse(localStorage.getItem(key)) || {};
      } catch {
        state = {};
      }
      state.issues ??= {};
      state.verified ??= {};
      state.signoffs ??= {};
      state.actions ??= [];
      state.notes ??= {};
      state.lastSeen ??= "v1";
      const E = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const money = (n) =>
        typeof n === "number"
          ? new Intl.NumberFormat("en-US", {
              style: "currency",
              currency: "USD",
              maximumFractionDigits: 0,
            }).format(n)
          : String(n ?? "—");
      const date = (s) => (s ? String(s).slice(0, 10) : "—");
      const byid = (list, id) => list.find((x) => x.id === id);
      const version = () => V.find((x) => x.version === currentVersion);
      const role = () => document.querySelector("#role").value;
      function persist() {
        localStorage.setItem(key, JSON.stringify(state));
      }
      function log(action, ref) {
        state.actions.unshift({
          at: new Date().toISOString(),
          role: role(),
          action,
          ref,
        });
        persist();
        toast(action);
      }
      function toast(t) {
        const el = document.querySelector("#notice");
        el.textContent = t;
        el.style.display = "block";
        setTimeout(() => (el.style.display = "none"), 2400);
      }
      const badge = (t, cls = "") => `<span class="tag ${cls}">${E(t)}</span>`;
      function go(which) {
        view = which;
        document.querySelector("#heading").textContent = names[which];
        document.querySelector("#nav").innerHTML = Object.entries(names)
          .map(
            ([k, n]) =>
              `<button class="nav ${k === view ? "active" : ""}" onclick="go('${k}')">${n}</button>`,
          )
          .join("");
        render();
        if (which === "checks") loadReconciliations();
        if (which === "corrections") loadCorrections();
        if (which === "filing") {loadFilingWorkflow();loadSnapshotAmendments();}
        if (which === "completeness") loadCompleteness();
      }
      function lineSelect(k) {
        selectedLine = k;
        go("trace");
      }
      async function loadDocumentFromBackend(id) {
  try {
    const response = await fetch(
      `/api/documents/${encodeURIComponent(id)}`
    );

    if (!response.ok) {
      throw new Error(`API returned ${response.status}`);
    }

    const data = await response.json();

    console.log("Evidence Library API:", data.document.id);

    return data;
  } catch (error) {
    console.error("Unable to load document:", error);
    return null;
  }
}
async function docSelect(id, p = 1) {
  selectedDoc = id;
  selectedPage = p;

  const data = await loadDocumentFromBackend(id);

  if (data) {// Replace this document's embedded extracted values
// with the values returned by FastAPI.
for (let i = ev.length - 1; i >= 0; i--) {
  if (ev[i].document_id === id) {
    ev.splice(i, 1);
  }
}

ev.push(...data.extracted_values);
    const index = docs.findIndex((d) => d.id === id);

    if (index !== -1) {
      docs[index] = data.document;
    }

    console.log(
      "Document retrieved from FastAPI:",
      data.document.id,
      data.extracted_values.length,
      "extracted values"
    );
  }

  go("documents");
}

      function issueSelect(id) {
        selectedIssue = id;
        go("issues");
      }
      function canReview() {
        return ["reviewer", "partner", "admin"].includes(role());
      }
      function status(i) {
        return state.issues[i.id]?.status || "open";
      }
      function summary() {
        const s = version().summary;
        return `<div class="stats"><div class="stat"><span>Documents indexed</span><strong>${docs.length}</strong><span>${ev.length.toLocaleString()} extracted values</span></div><div class="stat"><span>Source-linked return lines</span><strong>${version().lines.length}</strong><span>${currentVersion} current view</span></div><div class="stat"><span>Open exceptions</span><strong>${seed.filter((i) => status(i) !== "resolved").length}</strong><span>Independent checks</span></div><div class="stat"><span>Return versions</span><strong>${V.length}</strong><span>Latest ${date(V.at(-1).computed_at)}</span></div></div><div class="cols"><div class="panel"><h2>Exceptions requiring judgment</h2>${seed
          .slice(0, 8)
          .map(
            (i) =>
              `<div class="row" style="padding:10px 0;border-bottom:1px solid #edf0f3">${badge(i.severity, i.severity)}<a class="doclink" onclick="issueSelect('${i.id}')">${E(i.title)}</a><span class="right">${badge(status(i))}</span></div>`,
          )
          .join(
            "",
          )}<button class="btn secondary" style="margin-top:13px" onclick="go('issues')">See all ${seed.length} controls →</button></div><div><div class="panel"><h2>Computation snapshot</h2>${[
          "federal",
          "california",
        ]
          .map(
            (j) =>
              `<h3>${j[0].toUpperCase() + j.slice(1)}</h3>${Object.entries(
                s[j] || {},
              )
                .slice(0, 8)
                .map(
                  ([k, v]) =>
                    `<div class="row" style="padding:6px 0"><span class="small muted">${E(k.replaceAll("_", " "))}</span><b class="right">${money(v)}</b></div>`,
                )
                .join("")}`,
          )
          .join(
            "",
          )}</div><div class="panel"><h2>Review readiness</h2><p class="muted small">Sign-offs are blocked while critical issues remain open. The reviewer can record judgments and close verified exceptions.</p>${badge(seed.filter((x) => x.severity === "critical" && status(x) !== "resolved").length + " critical issues outstanding", "critical")}</div></div></div>`;
      }
      function trace() {
        const lines = version().lines;
        let line = lines.find((x) => x.key === selectedLine) || lines[0];
        const sourceIds = (line.sources || []).filter((x) =>
          x.startsWith("ev-"),
        );
        const linked = sourceIds.map((x) => byid(ev, x)).filter(Boolean);
        return `<div class="row"><label>Version <select onchange="currentVersion=this.value;render()">${V.map((x) => `<option ${x.version === currentVersion ? "selected" : ""}>${x.version}</option>`).join("")}</select></label><input placeholder="Search form, line, label, amount" value="${E(filter)}" oninput="filter=this.value;render()" style="flex:1"></div><div class="cols" style="margin-top:15px;grid-template-columns:1fr 1.25fr"><div class="panel"><h2>Computed lines</h2><div class="tablewrap"><table><tr><th>Return line</th><th>Value</th></tr>${lines
          .filter((x) =>
            `${x.key} ${x.label} ${x.value}`
              .toLowerCase()
              .includes(filter.toLowerCase()),
          )
          .slice(0, 250)
          .map(
            (x) =>
              `<tr class="clickable" onclick="selectedLine='${E(x.key)}';render()" style="${x.key === line.key ? "background:#eaf7f9" : ""}"><td>${E(x.key)}<div class="mini muted">${E(x.label)}</div></td><td>${money(x.value)}</td></tr>`,
          )
          .join(
            "",
          )}</table></div></div><div><div class="panel"><h2>${E(line.key)} · ${E(line.label)}</h2><div class="row"><strong style="font-size:26px">${money(line.value)}</strong>${badge(line.jurisdiction)}</div><p class="small muted">Rule: ${E(line.rule)} · Version: ${currentVersion}</p><p>${E(line.note || "No computation note provided.")}</p><h3>Dependency graph</h3><div class="details">${(line.inputs || []).length ? line.inputs.map((x) => `<a class="doclink" onclick="lineSelect('${E(x)}')">${E(x)}</a>`).join(" → ") : "No upstream line keys recorded"}<div style="margin-top:10px"><b>Verification</b> ${badge(state.verified[line.key] ? "verified" : "unverified", state.verified[line.key] ? "good" : "high")}</div></div><div style="margin-top:12px"><button class="btn" onclick="verifyLine('${E(line.key)}')">Record independent check</button></div></div><div class="panel"><h2>Source evidence (${linked.length})</h2>${linked.length ? linked.map((x) => `<div class="details" style="margin-bottom:9px"><div class="row"><b>${E(x.id)}</b>${badge(Math.round(x.confidence * 100) + "% confidence")}<span class="right doclink" onclick="docSelect('${x.document_id}',${x.page})">Open ${x.document_id} p.${x.page} ↗</span></div><div>${E(x.label)} · ${E(x.field)}</div><b>${E(x.text_as_read || x.value)}</b></div>`).join("") : "No direct extracted-value identifiers. Inspect dependency lines and other source references."}<p class="mini muted">Source links use recorded extraction IDs; no imputed fields.</p></div></div></div>`;
      }
     
async function verifyLine(k) {
  const note = prompt(
    "Evidence checked, independent method, and reviewer conclusion:"
  );

  if (!note || !note.trim()) return;

  try {
    const response = await fetch("/api/review-decisions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        reference_id: k,
        decision_type: "independent_verification",
        status: "verified",
        note: note.trim(),
        role: role()
      })
    });

    if (!response.ok) {
      throw new Error(`Save failed: ${response.status}`);
    }

    const saved = await response.json();

    state.verified[k] = {
      note: note.trim(),
      by: role(),
      at: new Date().toISOString(),
      version: currentVersion,
      database_id: saved.id
    };

    // Keep the existing browser journal in sync.
    log("Verified return line", k);
    render();

    console.log("Verification saved to SQLite:", saved);
  } catch (error) {
    console.error("Verification save failed:", error);
    alert("Unable to save verification. Please check your backend.");
  }
}

      function documents() {
        let d = byid(docs, selectedDoc) || docs[0],
          page = d.pages.find((x) => x.page === selectedPage) || d.pages[0],
          values = ev.filter(
            (x) => x.document_id === d.id && x.page === page.page,
          ),
          used = version().lines.filter((x) =>
            (x.sources || []).some((id) => values.some((e) => e.id === id)),
          );
        return `<div class="row"><input placeholder="Search document title, type or ID" value="${E(filter)}" oninput="filter=this.value;render()" style="flex:1"><span class="small muted">${docs.length} records • Source preview simulated from printed_content</span></div><div class="cols" style="grid-template-columns:.8fr 1.5fr;margin-top:15px"><div class="panel"><h2>Document index</h2><div class="tablewrap">${docs
          .filter((x) =>
            `${x.id} ${x.title} ${x.document_type}`
              .toLowerCase()
              .includes(filter.toLowerCase()),
          )
          .map(
            (x) =>
              `<div onclick="docSelect('${x.id}')" class="clickable" style="cursor:pointer;padding:10px;border-bottom:1px solid #edf0f3;${x.id === d.id ? "background:#e9f5f7" : ""}"><b>${x.id}</b> ${E(x.title)}<div class="mini muted">${E(x.document_type)} · ${x.page_count} page(s) · ${E(x.extraction.status)}</div></div>`,
          )
          .join(
            "",
          )}</div></div><div><div class="panel"><h2>${d.id}: ${E(d.title)}</h2><p class="small muted">${E(d.issuer)} · Received ${date(d.received_at)} · ${badge(d.extraction.status, d.extraction.status === "partial" ? "high" : "")}</p><div class="row" style="margin-bottom:12px">${d.pages.map((x) => `<button class="btn ${page.page === x.page ? "" : "secondary"}" onclick="selectedPage=${x.page};render()">p.${x.page}</button>`).join("")}</div><div class="document">${E(page.printed_content)}</div><h3 style="margin-top:18px">Extracted fields on this page</h3><div class="tablewrap" style="max-height:280px"><table><tr><th>Field</th><th>Extraction</th><th>Confidence</th></tr>${values
          .slice(0, 80)
          .map(
            (x) =>
              `<tr><td>${E(x.label || x.field)}<div class="mini">${E(x.id)}</div></td><td>${E(x.text_as_read || x.value)}</td><td>${Math.round(x.confidence * 100)}%</td></tr>`,
          )
          .join(
            "",
          )}</table></div><h3 style="margin-top:15px">Where these fields landed</h3>${
          used.length
            ? used
                .slice(0, 30)
                .map(
                  (x) =>
                    `<div class="row" style="padding:6px 0"><a class="doclink" onclick="lineSelect('${E(x.key)}')">${E(x.key)}</a><span class="small muted">${E(x.label)}</span><b class="right">${money(x.value)}</b></div>`,
                )
                .join("")
            : "No directly traced return line from this page in this version. Verify whether omitted, replaced, or used via other records."
        }</div></div></div>`;
      }
      function issues() {
        let i = seed.find((x) => x.id === selectedIssue) || seed[0],
          s = state.issues[i.id] || {};
        return `<div class="cols" style="grid-template-columns:1fr 1.2fr"><div class="panel"><div class="row"><h2>Exception queue</h2><button class="btn secondary right" onclick="bulkTriage()">Batch assign open → reviewer</button></div>${bulkBatchHistory()}${seed.map((x) => `<div style="padding:13px 5px;cursor:pointer;border-bottom:1px solid #e9edf2;${x.id === i.id ? "background:#eff8fa" : ""}" onclick="selectedIssue='${x.id}';render()"><div class="row">${badge(x.severity, x.severity)}<b>${x.id}</b><span class="right">${badge(status(x), status(x) === "resolved" ? "good" : "")}</span></div><div>${E(x.title)}</div></div>`).join("")}</div><div class="panel"><div class="row">${badge(i.severity, i.severity)} ${badge(status(i), status(i) === "resolved" ? "good" : "")}</div><h2 style="margin-top:13px">${E(i.title)}</h2><p>${E(i.explanation)}</p><button class="btn secondary" onclick="docSelect('${i.doc}')">Inspect source ${i.doc} ↗</button><h3 style="margin-top:22px">Decision record</h3><p class="muted small">Document judgment and the evidence checked. Resolving requires reviewer/partner permission; prior history is retained in the audit trail.</p><label class="small">Assigned to <select id="owner"><option value="preparer" ${s.owner === "preparer" ? "selected" : ""}>Preparer</option><option value="reviewer" ${s.owner === "reviewer" ? "selected" : ""}>Reviewer</option><option value="partner" ${s.owner === "partner" ? "selected" : ""}>Partner</option></select></label><p><textarea id="decision" placeholder="What was inspected? What was decided? What is the impact?">${E(s.note || "")}</textarea></p><div class="row"><button class="btn" onclick="saveIssue('${i.id}',false)">Save judgment</button><button class="btn secondary" onclick="saveIssue('${i.id}',true)">Resolve after verification</button></div>${s.by ? `<p class="small muted">Last changed by ${E(s.by)} on ${date(s.at)}</p>` : ""}</div></div>`;
      }
      
async function saveIssue(id, resolve) {
  if (resolve && !canReview()) {
    return toast("Reviewer, partner or admin permission required");
  }

  const note = document.querySelector("#decision").value.trim();

async function loadSavedVerifications() {
  try {
    const response = await fetch("/api/review-decisions");

    if (!response.ok) {
      throw new Error(`Unable to load decisions: ${response.status}`);
    }

    const decisions = await response.json();
    const loaded = new Set();

    // The API returns newest decisions first.
    // Keep the latest decision for each return line.
    for (const decision of decisions) {
      if (decision.decision_type !== "independent_verification") {
        continue;
      }

      const key = decision.reference_id;

      if (loaded.has(key)) continue;
      loaded.add(key);

      if (decision.status === "verified") {
        state.verified[key] = {
          note: decision.note,
          by: decision.role,
          at: decision.created_at,
          version: currentVersion,
          database_id: decision.id
        };
      } else {
        delete state.verified[key];
      }
    }

    render();
    console.log("Verifications loaded from SQLite:", loaded.size);
  } catch (error) {
    console.error("Unable to load saved verifications:", error);
  }
}

async function loadSavedExceptions() {
  try {
    const response = await fetch("/api/exceptions");

    if (!response.ok) {
      throw new Error(`Unable to load exceptions: ${response.status}`);
    }

    const exceptions = await response.json();

    for (const item of exceptions) {
      state.issues[item.exception_id] = {
        status: item.status,
        note: item.note || "",
        owner: item.assigned_role,
        by: "Saved review",
        at: new Date().toISOString()
      };
    }

    render();

    console.log("Exceptions loaded from SQLite:", exceptions.length);
  } catch (error) {
    console.error("Unable to load saved exceptions:", error);
  }
}

async function loadSavedSignoffs() {
  try {
    const response = await fetch("/api/signoffs");

    if (!response.ok) {
      throw new Error(`Unable to load sign-offs: ${response.status}`);
    }

    const signoffs = await response.json();

    // Remove stale browser-only approvals.
    state.signoffs = {};

    for (const item of signoffs) {
      if (item.return_version !== currentVersion) continue;

      state.signoffs[item.role] = {
        at: item.signed_at,
        version: item.return_version,
        database_id: item.id
      };
    }

    render();

    console.log("Sign-offs loaded from SQLite:", signoffs.length);
  } catch (error) {
    console.error("Unable to load saved sign-offs:", error);
  }
}

          const data = await response.json();

          console.log("Document loaded from backend:", {
            id: data.document.id,
            title: data.document.title,
            extractedValues: data.extracted_values.length,
          });
        } catch (error) {
          console.error("Document API failed:", error);
        }
      }

      testDocumentAPI();

      testBackendConnection();
    </script>
  </body>
</html>
